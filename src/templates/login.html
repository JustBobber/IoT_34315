<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GenStraek</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Courier New", Courier, monospace;
            background: #f7931a;
            min-height: 100vh;
        }

        .page-wrapper {
            padding: 40px 20px;
        }

        .main-card {
            background: #e8e3da;
            border-radius: 28px;
            overflow: hidden;
            max-width: 1400px;
            margin: 0 auto;
        }

        .top-bar {
            background: #e2ddd5;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 28px 36px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo img {
            height: 78px;
            width: auto;
            object-fit: contain;
        }

        .brand {
            font-size: 3.2rem;
            color: #000;
            font-weight: 500;
        }

        .tagline {
            font-size: 1.1rem;
            color: #666;
            margin-left: 12px;
            white-space: nowrap;
        }

        .content {
            display: flex;
            justify-content: space-between;
            gap: 50px;
            padding: 55px 28px 50px 28px;
            flex-wrap: wrap;
        }

        .left-section {
            flex: 1 1 700px;
            min-width: 320px;
        }

        .right-section {
            flex: 0 0 420px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        h1, h2 {
            font-weight: 500;
            color: #000;
            margin-bottom: 26px;
        }

        h1 {
            font-size: 2.1rem;
        }

        h2 {
            font-size: 2rem;
            margin-top: 70px;
        }

        .user-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 34px;
            list-style: none;
            margin-bottom: 30px;
        }

        .user-card {
            background: #f4f4f4;
            border-radius: 22px;
            width: 320px;
            min-height: 255px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: none;
            transition: transform 0.15s ease;
        }

        .user-card:hover {
            transform: translateY(-3px);
        }

        .user-link {
            text-decoration: none;
            color: inherit;
            display: block;
            width: 100%;
            height: 100%;
        }

        .avatar {
            width: 108px;
            height: 108px;
            background: #bdbdbd;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
        }

        .avatar::before {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            background: #232832;
            border-radius: 50%;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .avatar::after {
            content: "";
            position: absolute;
            width: 74px;
            height: 34px;
            background: #232832;
            border-radius: 50% 50% 45% 45%;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
        }

        .username {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .last-session {
            font-size: 0.95rem;
            color: #222;
        }

        .empty-users {
            font-size: 1rem;
            color: #333;
            margin-bottom: 20px;
        }

        .create-box {
            background: #f4f4f4;
            border-radius: 22px;
            padding: 24px 18px 28px 18px;
            max-width: 700px;
        }

        .create-title {
            font-size: 1.2rem;
            margin-bottom: 18px;
        }

        .create-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .create-form input {
            flex: 1 1 380px;
            height: 60px;
            border: 1px solid #bbb;
            border-radius: 18px;
            padding: 0 20px;
            font-family: inherit;
            font-size: 1rem;
            background: #f9f9f9;
        }

        .create-form button {
            height: 60px;
            padding: 0 34px;
            border: none;
            border-radius: 18px;
            background: #f7931a;
            color: white;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
        }

        .create-form button:hover {
            filter: brightness(0.96);
        }

        .product-box {
            width: 100%;
            max-width: 520px;
            height: 650px;
            background: #7f7f7f;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0f0f0;
            font-size: 2rem;
            text-align: center;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            text-decoration: none;
            color: #000;
            font-size: 1rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 1100px) {
            .content {
                flex-direction: column;
            }

            .right-section {
                flex: 1 1 auto;
                justify-content: flex-start;
            }

            .product-box {
                height: 420px;
                max-width: 700px;
            }

            .tagline {
                margin-left: 0;
            }
        }

        @media (max-width: 700px) {
            .brand {
                font-size: 2.2rem;
            }

            .tagline {
                font-size: 0.95rem;
                white-space: normal;
            }

            h1, h2 {
                font-size: 1.7rem;
            }

            .user-card {
                width: 100%;
            }

            .create-form {
                flex-direction: column;
            }

            .create-form input,
            .create-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="main-card">
            <div class="top-bar">
                <div class="logo">
                    <!-- Replace with your real logo file if you have one -->
                    <img src="{{ url_for('static', filename='images/Genstraek_logo.png') }}" alt="GenStraek logo">
                    <div class="brand">GenStraek</div>
                </div>
                <div class="tagline">Track and improve your shoulder mobility</div>
            </div>

            <div class="content">
                <div class="left-section">
                    <h1>Chose Your Profile</h1>

                    {% if users %}
                        <ul class="user-grid">
                            {% for user in users %}
                                <li class="user-card">
                                    <a class="user-link" href="{{ url_for('login_select', user_id=user.user_id) }}">
                                        <div class="avatar"></div>
                                        <div class="username">{{ user.username }}</div>
                                        <div class="last-session">Last session: 18/04/26</div>
                                    </a>
                                </li>
                            {% endfor %}
                        </ul>
                    {% else %}
                        <p class="empty-users">Ingen brugere endnu.</p>
                    {% endif %}

                    <h2>New Here?</h2>

                    <div class="create-box">
                        <div class="create-title">Create new profile</div>
                        <form class="create-form" method="POST" action="/login/create">
                            <input type="text" name="username" placeholder="Name" required>
                            <button type="submit">Create profile</button>
                        </form>
                    </div>

                    <a class="back-link" href="{{ url_for('index') }}">← Tilbage</a>
                </div>

                <div class="right-section">
                    <div class="product-box">
                        IMAGE OF PRODUCT
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
